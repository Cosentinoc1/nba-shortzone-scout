name: NBA Scout Daily Results

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        options:
          - auto
          - capture
          - grade
        default: auto
      date:
        description: 'Optional YYYY-MM-DD slate date for grading (not historical capture)'
        required: false
        type: string
  schedule:
    # UTC: 9am, 11am, 1pm, 3pm, 5pm Central in winter;
    # 10am, noon, 2pm, 4pm, 6pm Central during daylight saving.
    # The capture code STRICTLY excludes already-started games.
    - cron: '10 15,17,19,21,23 * * *'
    # Morning postgame audit; an additional retry handles source outages.
    - cron: '35 14,18 * * *'

permissions:
  contents: write

concurrency:
  group: nba-scout-review-history
  cancel-in-progress: false

jobs:
  capture-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run exact pretip capture or official box-score audit
        env:
          REVIEW_MODE: ${{ inputs.mode }}
          REVIEW_DATE: ${{ inputs.date }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          NBA_SCOUT_URL: https://nba-shotzone-scout.onrender.com
        run: |
          set -euo pipefail
          mode="${REVIEW_MODE:-auto}"
          if [ "$mode" = 'auto' ]; then
            if [ "${TRIGGER_CRON:-}" = '35 14,18 * * *' ]; then mode='grade'; else mode='capture'; fi
          fi
          if [ "$mode" != 'capture' ] && [ "$mode" != 'grade' ]; then echo 'Unsupported review mode'; exit 1; fi
          if [ -n "${REVIEW_DATE:-}" ]; then
            if ! [[ "$REVIEW_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo 'Invalid date format'; exit 1; fi
            node scripts/update-review.mjs "$mode" "$REVIEW_DATE"
          else
            node scripts/update-review.mjs "$mode"
          fi
      - name: Commit persistent review history (if changed)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/review/history.json
          if git diff --cached --quiet; then
            echo 'No review history changes'; exit 0
          fi
          git commit -m 'Audit NBA Scout pretip rankings and final box scores'
          git pull --rebase origin main
          git push origin HEAD:main
