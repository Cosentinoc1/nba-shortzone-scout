
name: NBA Scout Auto-Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NBA_Scout_RELEASE_v*.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Extract and test latest release
        run: |
          set -euo pipefail
          FILE=$(ls -1 NBA_Scout_RELEASE_v*.zip | sort -V | tail -n 1)
          test -n "$FILE"
          unzip -oq "$FILE"
          npm test

      - name: Commit tested source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/workflows/tests.yml'
          if ! git diff --cached --quiet; then
            git commit -m "Install latest NBA Scout release"
            git push
          fi
